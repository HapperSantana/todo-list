<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Do List</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark shadow " style="background-color: #98b8f4 !important;">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                📝 To-Do List
            </span>

        </div>

    </nav>


    <!-- CONTENIDO -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Título -->

                <div class="text-center mb-4">

                    <h1 class="fw-bold">
                        Administrador de tareas
                    </h1>

                    <p class="text-muted">
                        Organiza tus actividades fácilmente
                    </p>

                </div>


                <!-- FORMULARIO -->

                <div class="card shadow-sm mb-4">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">
                            Nueva tarea
                        </h5>

                    </div>

                    <div class="card-body">

                        <form id="formTarea">

                            <div class="mb-3">

                                <label
                                    for="titulo"
                                    class="form-label"
                                >
                                    Título
                                </label>

                                <input
                                    type="text"
                                    id="titulo"
                                    class="form-control"
                                    placeholder="Ej. Estudiar Node.js"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="descripcion"
                                    class="form-label"
                                >
                                    Descripción
                                </label>

                                <textarea
                                    id="descripcion"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Descripción de la tarea"
                                ></textarea>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                ➕ Agregar tarea
                            </button>

                        </form>

                    </div>

                </div>


                <!-- ESTADÍSTICAS -->

                <div class="row mb-4">

                    <div class="col-md-4 mb-2">

                        <div class="card text-center shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total
                                </h6>

                                <h3 id="totalTareas">
                                    0
                                </h3>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-4 mb-2">

                        <div class="card text-center shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Pendientes
                                </h6>

                                <h3
                                    id="pendientes"
                                    class="text-warning"
                                >
                                    0
                                </h3>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-4 mb-2">

                        <div class="card text-center shadow-sm">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Completadas
                                </h6>

                                <h3
                                    id="completadas"
                                    class="text-success"
                                >
                                    0
                                </h3>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- LISTA DE TAREAS -->

                <div class="card shadow-sm">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">
                            Mis tareas
                        </h5>

                    </div>

                    <div
                        class="card-body"
                        id="listaTareas"
                    >

                        <div class="text-center text-muted">

                            Cargando tareas...

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- MODAL EDITAR -->

    <div
        class="modal fade"
        id="modalEditar"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Editar tarea
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="editarId"
                    >

                    <div class="mb-3">

                        <label class="form-label">
                            Título
                        </label>

                        <input
                            type="text"
                            id="editarTitulo"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea
                            id="editarDescripcion"
                            class="form-control"
                            rows="3"
                        ></textarea>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        class="btn btn-primary"
                        onclick="guardarEdicion()"
                    >
                        Guardar cambios
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JavaScript -->

    <script src="app.js"></script>

</body>

</html>
